[project]
name = "aiarena-api"
dynamic = ["version"]
description = "An async Python client for the aiarena.net API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Nusspickel", email = "max.nusspickel@gmail.com" }]
keywords = ["StarCraft", "StarCraft 2", "StarCraft II", "AI Arena", "aiarena"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/maxnus/aiarena-api"
Repository = "https://github.com/maxnus/aiarena-api"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the git tag; releases are made by tagging. The fallback is for a checkout without tags.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/aiarena_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
